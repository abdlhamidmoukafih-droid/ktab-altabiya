<style>

body{background:var(--bg);min-height:100vh;font-family:'Cairo',sans-serif;}

/* PAYWALL MODAL */

.pw-icon{font-size:44px;margin-bottom:10px;}
.pw-title{font-family:'Amiri',serif;color:var(--text);font-size:1.25rem;margin-bottom:6px;}
.pw-sub{color:var(--text2);font-size:0.82rem;line-height:1.7;margin-bottom:14px;}

.rip-num{font-family:monospace;font-size:0.9rem;direction:ltr;color:var(--text);word-break:break-all;}
.rip-price{font-size:1.1rem;font-weight:700;color:var(--accent);margin-top:6px;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:#25D366;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;font-size:0.9rem;margin-bottom:12px;font-family:'Cairo',sans-serif;}
.divider{color:#ccc;font-size:0.78rem;margin:10px 0;}
.pw-input{width:100%;padding:12px;background:#f6faf7;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;text-align:center;letter-spacing:3px;font-family:'Cairo',sans-serif;outline:none;margin-bottom:8px;direction:ltr;}
.pw-input:focus{border-color:var(--accent);}
.pw-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.95rem;margin-bottom:10px;}
.pw-back{width:100%;padding:11px;background:rgba(27,94,59,0.08);border:1px solid var(--border);color:var(--accent);font-weight:700;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.9rem;}
.pw-err{color:#c0392b;font-size:0.82rem;margin-top:6px;min-height:18px;}

#langBar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;background:linear-gradient(to bottom,rgba(232,240,235,0.98),transparent);}
.lb{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.9);color:var(--text2);font-size:0.75rem;cursor:pointer;font-family:'Cairo',sans-serif;transition:all 0.2s;}
.lb.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}

/* BOOK */
#bookWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:65px 14px 75px;}
.book-stage{width:min(680px,95vw);}

.spine{width:24px;min-height:520px;background:linear-gradient(to right,#040d08,#1b4332,#2d6a4f);border-radius:3px 0 0 3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.spine-txt{writing-mode:vertical-rl;color:rgba(100,220,150,0.45);font-size:0.6rem;letter-spacing:2px;transform:rotate(180deg);font-family:'Cairo',sans-serif;}
.pages{flex:1;position:relative;min-height:520px;}
.page{position:absolute;inset:0;background:var(--page);border-radius:0 8px 8px 0;padding:34px 28px 26px;overflow:hidden;box-shadow:4px 4px 20px rgba(27,94,59,0.1);display:none;flex-direction:column;animation:pIn 0.3s ease;}
.page.on{display:flex;}
.page.cover{background:linear-gradient(145deg,#081c15,#1b4332,#0d2818);}
.page.bcover{background:linear-gradient(145deg,#081c15,#0d2818);}
@keyframes pIn{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:translateX(0);}}

.cv-c.tr{top:12px;left:12px;border-width:1px 0 0 1px;}
.cv-c.bl{bottom:12px;right:12px;border-width:0 1px 1px 0;}

.pt{font-family:'Amiri',serif;color:var(--text);font-size:clamp(0.82rem,1.9vw,0.95rem);line-height:2;text-align:justify;}

.bl li::before{content:'';position:absolute;right:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--accent);}

/* BACK */

.bc-q{font-family:'Amiri',serif;color:rgba(245,230,200,0.85);font-size:1rem;line-height:2;text-align:center;font-style:italic;padding:18px;border:1px solid rgba(64,145,108,0.2);border-radius:8px;margin-bottom:14px;}

/* CONTROLS */
#ctrl{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;background:linear-gradient(to top,rgba(232,240,235,0.98),transparent);}
.cb{width:44px;height:44px;border-radius:50%;background:rgba(27,94,59,0.1);border:1px solid var(--border);color:var(--accent);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}

.cb:disabled{opacity:0.25;cursor:default;}
.cb.active-back{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.15);}
.pi{color:var(--text2);font-size:0.75rem;min-width:68px;text-align:center;opacity:0.6;}

/* WA FLOAT */

#waF a{display:flex;align-items:center;gap:7px;background:#25D366;color:#fff;padding:9px 15px;border-radius:28px;text-decoration:none;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.8rem;box-shadow:0 4px 14px rgba(37,211,102,0.35);}

html[dir="ltr"] .pt{text-align:left;}
html[dir="ltr"] .ph{flex-direction:row-reverse;}
html[dir="ltr"] .bl li{padding-left:15px;padding-right:0;}
html[dir="ltr"] .bl li::before{left:3px;right:auto;}
html[dir="ltr"] .pt .hl{border-left:3px solid var(--accent);border-right:none;}
</style>

const pages = [
{t:'cover'},
{t:'p',ch:'mq',n:1,c:{
d:`<p>أفين، هانية؟ مزيان؟ أش كتعاود؟ كلشي بيخير؟ الوالدة، الخوت، كلشي مزيان؟ إيوا الحمد لله.</p>
<p>داك خونا اللي فيه الصواب بزاف بحال العيالات، هههه، لا غير ضاحكين. داكشي ما عندو حتى علاقة بدوك خوتنا الله ينجينا منهم اللي كيوليو بحال العيالات، كيبقاو بيناتهم: "كيفاش أختي؟"، وهو كيدوي مع عشيرو! زعما شي ناس الله يهديهم.</p>
<p>وبزاف ديال الحوايج بحال هكا، بالأخص مؤخراً، ولى كيبان ليك كاع الناس صحراوي، مكرّد وكي… فهمتي؟ وكتلقى واحد إمام كيعجبوه الدراري! وزيد عليها، حنا عارفين أن الناس كتلقى واحد النوعية كتشابه، وكتلاحظ فگاع هاد الجينوس كاين فالدومين ديال الگاي. هادشي ماشي نورمال أخويا، فين كنا وفين ولينا!</p>`,
a:`<p>يا هلا، كيف الحال؟ عساك طيب؟ الأمور زينة؟ الوالدة، الإخوان، كلهم بخير؟ الحمد لله.</p>
<p>ذاك الخوي اللي فيه رسميات واجد ومجاملات كأنه من الحريم، ههههه… لا لا، أمزح معك! الله يكفينا شر هالنوعية اللي يقلبون حريم، تلقاهم يقولون لبعض "يا أختي".</p>
<p>خاصة بالفترة الأخيرة، ممكن تشوف لك واحد صحراوي معضل وجسمه يفجع، وتكتشف بالنهاية إنه إمام وميوله للعيال. وتلاحظ إن كل هالنوعيات طايحين في هالمجال حق الشذوذ. هالموضوع مو طبيعي يا خوي.</p>`,
f:`<p>Salut, ça roule ? Tout va bien ? Ta mère, tes frères, tout le monde va bien ? Dieu merci.</p>
<p>Ce mec qui fait trop de manières comme les meufs, mdrrr… non, je déconne ! Et ne parlons même pas de celui avec la barbe… bref, t'as capté.</p>
<p>Surtout dernièrement, tu peux voir un gars du Sahara, musclé et tout, et tu découvres que c'est un imam qui kiffe les garçons. C'est pas normal, mon frère. Regarde où on était et où on en est maintenant !</p>`,
e:`<p>Hey, how are you doing? Everything fine? Your mom, the siblings, everyone good? Thank God.</p>

<p>Especially lately, you might see a tough Sahrawi guy, muscular and all, and you find out he's an imam who likes boys. This isn't normal, bro. Look where we were and where we are now!</p>`,
s:`<p>Hola, ¿qué tal? ¿Todo bien? ¿Tu madre, tus hermanos, todos bien? Gracias a Dios.</p>

zh:`<p>嘿，哥们，最近好吗？一切都好吗？你妈，你兄弟姐妹，大家都好吗？谢天谢地。</p>
<p>那个像女人一样客气过头的家伙，哈哈哈……不，开玩笑的！愿上帝保佑我们远离那些变得像女人的家伙。</p>
<p>特别是最近，你可能会看到一个强壮、肌肉发达的撒哈拉硬汉，结果发现他是个喜欢男生的伊玛目。这不正常，兄弟。</p>`
}},
{t:'p',ch:'mq',n:2,c:{
d:`<p>ولكن مافيها باس جبدنا هاد الموضوع، أجي نتفلسفو فيه شوية، ما خاسرين والو. وأنا بيني وبينك داير ليك هاد الدخلة غير باش نجبد معاك هاد الموضوع.</p>
<p>فهاد السنوات الأخيرة، ولات المثلية الجنسية واحد الموضوع حاضر بقوة فالنقاش العالمي. ومع أن القانون فبلدان بحال المغرب مازال كيعاقب على العلاقات المثلية، إلا أن وجودها فالمجتمع واقع ما يمكنش إنكاره.</p>
<p>فهاد الكتاب غادي نحاولو أنا وياك نفهمو العمق ديال هادشي. ما تحكمش دابا، خلينا نمشيو دقة دقة وداك الساعة حكم.</p>`,
a:`<p>بس ما يخالف، طالما فتحنا السالفة، خلنا نتفلسف فيها شوي — ترا ما ورانا شيء نخسره.</p>
<p>في السنوات الأخيرة، صار المثلية الجنسية موضوع حاضر بقوة في النقاشات العالمية. ورغم إن القانون في دول زي المغرب لسه يعاقب على العلاقات المثلية، إلا إن وجودها في المجتمع واقع ما نقدر ننكره.</p>
<p>في هالكتاب، أنا وأنت راح نحاول نفهم عمق هالموضوع. لا تحكم الحين. خلنا نمشي حبة حبة، وبعدين احكم.</p>`,
f:`<p>Mais c'est pas grave, puisqu'on a abordé le sujet, philosophons un peu — on n'a rien à perdre.</p>
<p>Ces dernières années, l'homosexualité est devenue un sujet très présent dans les débats mondiaux. Même si la loi dans des pays comme le Maroc punit toujours les relations homosexuelles, leur existence dans la société est une réalité indéniable.</p>
<p>Dans ce bouquin, toi et moi, on va essayer de comprendre la profondeur de ce truc. Ne juge pas tout de suite. Allons-y doucement.</p>`,
e:`<p>But it's fine, since we brought up the topic, let's philosophize about it a bit — we have nothing to lose.</p>
<p>In recent years, homosexuality has become a strongly present topic in global discussions. Even though the law in countries like Morocco still punishes same-sex relationships, their existence in society is an undeniable reality.</p>
<p>In this book, you and I will try to understand the depth of this issue. Don't judge now. Let's take it step by step.</p>`,
s:`<p>Pero bueno, ya que sacamos el tema, vamos a filosofar un poco — no tenemos nada que perder.</p>
<p>En los últimos años, la homosexualidad se ha convertido en un tema muy presente en los debates mundiales. Aunque la ley en países como Marruecos todavía castiga las relaciones homosexuelles, su existencia en la sociedad es una realidad innegable.</p>`,
zh:`<p>不过没关系，既然我们提到了这个话题，那我们就来稍微探讨一下人生哲学吧——反正我们也没什么损失。</p>
<p>近年来，同性恋已成为全球讨论中非常热门的话题。尽管在摩洛哥等国家，法律仍然会惩罚同性关系，但它们在社会中的存在是一个不可否认的现实。</p>`
}},
{t:'p',ch:'mq',n:3,c:{
d:`<p>كيفاش كتستنتج إلى لاحظتي نتا كتحس بميول جنسي ولكن فنفس الوقت كتبقى تقول: "مافهمتش أنا مالي؟ واش أنا بوحدي اللي هاكا؟" إذن أنا هو هاداك الشخص اللي كيعيطو عليه بذاك المصطلح، راك عارف، بلا ما نگولو حشمنا منك هههه.</p>
<p>وداك المصطلح مطروح على الواقع كاين، إذن كتستنتج: أنا حيت كاين وشائع وعندو اهتمام كبير، أنك راه ماشي بوحدك. وأن هادشي يقدر يكون عندو علاقة بالجينات مثلاً، أو بالمجتمع اللي عايش فيه.</p>
<p>دابا أنا وياك شنو غانديرو؟ غانحاولو نعطيو فرصة لجانب خور. نتا ما خاسر والو! يالاه نبداو نطرحو أسئلة ونكشيو مع بعضياتنا.</p>`,
a:`<p>كيف تستنتج لو لاحظت إنك تحس بميول جنسي، بس بنفس الوقت قاعد تقول: "أنا ماني فاهم وش فيني، هل أنا الوحيد اللي كذا؟" بعدين تستوعب: "آها، أجل أنا من النوعية اللي يسمونهم بذاك المصطلح" — عاد أنت عارفه، مستحين منك.</p>
<p>اللي راح نسويه أنا وأنت هو إننا نعطي فرصة لجانب ثاني. ما راح تخسر شيء! خلنا نبدأ نطرح الأسئلة ونفك هالعقدة مع بعض.</p>`,
f:`<p>Comment tu conclus ça ? Si tu remarques que tu ressens une attirance sexuelle, mais qu'en même temps tu te dis : "Je ne comprends pas ce qui m'arrive, est-ce que je suis le seul comme ça ?" — tu connais le terme, pas besoin de le dire, on est trop timides, mdr.</p>
<p>Ce qu'on va faire, toi et moi, c'est donner une chance à une autre perspective. Tu n'as rien à perdre ! Commençons à poser des questions ensemble.</p>`,
e:`<p>How do you conclude this? If you noticed that you feel sexual attraction, but at the same time you keep saying: "I don't understand what's wrong with me, am I the only one like this?" — you know the term, no need to say it, we're too shy, lol.</p>
<p>What you and I are going to do is give another perspective a chance. You have nothing to lose! Let's start asking questions together.</p>`,
s:`<p>¿Cómo concluyes esto? Si notaste que sientes atracción sexual, pero al mismo tiempo sigues diciendo: "No entiendo qué me pasa, ¿soy el único así?" — ya sabes el término, no hace falta decirlo, somos demasiado tímidos, jajaja.</p>
<p>Lo que vamos a hacer, tú y yo, es darle una oportunidad a otra perspectiva. ¡No tienes nada que perder!</p>`,
zh:`<p>如果你注意到你感到了性吸引，但同时你又在说："我不明白我怎么了，难道只有我这样吗？"——你知道那个词，没必要说出来，我们太害羞了，哈哈哈。</p>
<p>现在，你和我要做的是给另一个视角一个机会。你没什么损失！让我们开始提问，一起搞清楚这一切。</p>`
}},

d:`<div class="ch">الفصل الأول: من الأصل تال البروستات</div>
<p>نرجعو شوية للّور، نبداو من الأصل. كُلنا كنعرفو أن حنا جينا على تطوُّر.</p>
<p>عمرك تساءلتي وگلتي: <strong>علاش البروستات جاية جهة الدبر؟</strong> بلُغتنا حنا "الخرزة". البروستات هي واحد الغدة صغيرة (فيها تقريباً بين 11 حتى 20 غرام عند الراجل البالغ)، وكاينة غير عند الرجال. البلاصة ديالها: كاينة نيشان تحت المثانة، وقدام المستقيم.</p>
<p>هنا بانت ليا ثغرة: يقدر تكون هاديك هي أقرب position ديالها، ويكون عندها دور ثانوي. مايكونش الذكر عبر التطور كان كيمارس المثلية من الخلف، وهي اللي خلات البروستات يجي قريب من القضيب؟</p>
<div class="hl">المسافة بين البروستات والقضيب: 5-7 سم<br>المسافة بينها وبين فتحة الدبر: 2 سم فقط</div>`,
a:`<div class="ch">الفصل الأول: من الأصل لين البروستاتا</div>
<p>خلنا نرجع شوي للوراء، نبدأ من الأساس. كلنا عارفين إننا جينا نتيجة التطور.</p>
<p>هل سألت نفسك يوم: <strong>ليش البروستاتا جاية جهة الدبر؟</strong> البروستاتا غدة صغيرة حجمها مثل جوزة (حوالي 11 لين 20 غرام). مكانها: تحت المثانة مباشرة، وقدام المستقيم.</p>
<div class="hl">المسافة بين البروستاتا والعضو الذكري: من 5 لين 7 سم<br>المسافة بينها وبين فتحة الدبر: 2 سم بس</div>`,
f:`<div class="ch">Chapitre 1 : De l'origine à la prostate</div>
<p>T'es-tu jamais demandé : <strong>pourquoi la prostate se trouve-t-elle du côté de l'anus ?</strong> La prostate est une petite glande (environ 11 à 20 grammes chez l'homme adulte), juste sous la vessie, devant le rectum.</p>
<div class="hl">Distance entre la prostate et le pénis : 5 à 7 cm<br>Distance entre elle et l'anus : seulement 2 cm</div>`,
e:`<div class="ch">Chapter 1: From Origins to the Prostate</div>
<p>Have you ever asked yourself: <strong>why is the prostate located near the anus?</strong> The prostate is a small gland (approximately 11 to 20 grams in an adult male), right below the bladder, in front of the rectum.</p>
<div class="hl">Distance between prostate and penis: 5 to 7 cm<br>Distance between it and the anus: only 2 cm</div>`,
s:`<div class="ch">Capítulo 1: Del origen a la próstata</div>
<p>¿Te has preguntado alguna vez: <strong>¿por qué la próstata se encuentra cerca del ano?</strong> La próstata es una glándula pequeña (aproximadamente 11 a 20 gramos), justo debajo de la vejiga, delante del recto.</p>
<div class="hl">Distancia entre próstata y pene: 5 a 7 cm<br>Distancia entre ella y el ano: solo 2 cm</div>`,
zh:`<div class="ch">第一章：从起源到前列腺</div>
<p>你有没有问过自己：<strong>前列腺为什么位于肛门附近？</strong>前列腺是一个小腺体（成年男性约11至20克），就在膀胱下方，直肠前面。</p>
<div class="hl">前列腺与阴茎之间的距离：5至7厘米<br>它与肛门之间的距离：仅2厘米</div>`
}},

d:`<div class="ch">الفصل الثاني: الجانب النفسي وتاريخ الأحكام</div>
<p>حنا حالياً راه اللي مخليينا على قيد الحياة وجيناتنا قوية، هي الأحاسيس والمشاعر: <strong>متعة، حزن، خوف، أمان…</strong> الحزن؟ راه حتى هو ضروري. كون ماكانش الحزن، كون الوجود ما عندو معنى.</p>
<p>والدوبامين هو اللي كيتفرز فاش كتكون فعلاقة جنسية. دماغك هنا كيدير:</p>
<div class="hl">"اللي كيجيب ليا هاد الشعور = حاجة زوينة = نعاودها"</div>
<p>حنا كلنا عارفين بأن المثلية عندها تاريخ موثق ومقبولة اجتماعياً. شنو دارو؟ ولات المثلية ممنوعة اجتماعياً. هاد الاختلاف بين الجينات والأحكام الاجتماعية هو اللي مخليك ما تتصالحش مع راسك.</p>`,
a:`<div class="ch">الفصل الثاني: الجانب النفسي وتاريخ الأحكام</div>
<p>اللي يخلينا على قيد الحياة ويخلي جيناتنا قوية، هي المشاعر والأحاسيس: <strong>المتعة، الحزن، الخوف، الأمان…</strong> حتى الحزن ضروري.</p>
<p>والدوبامين هو اللي يتحرر لما تكون في علاقة جنسية. مخك يسوي ربط:</p>
<div class="hl">"اللي يعطيني هالإحساس = شيء زين = راح أعيده"</div>
<p>كلنا عارفين إن المثلية عندها تاريخ موثق وكانت مقبولة اجتماعياً. شنو صار؟ ولات المثلية ممنوعة. هالتعارض بين الجينات والأحكام هو اللي يمنعك من تقبل نفسك.</p>`,
f:`<div class="ch">Chapitre 2 : Le côté psychologique</div>
<p>Ce qui nous maintient en vie, ce sont les émotions : <strong>le plaisir, la tristesse, la peur, la sécurité…</strong> Même la tristesse est nécessaire.</p>
<p>La dopamine est libérée quand tu es dans une relation sexuelle. Ton cerveau fait une connexion :</p>
<div class="hl">"Ce qui me donne cette sensation = quelque chose de bien = je vais le refaire"</div>
<p>Tout le monde sait que l'homosexualité a une histoire documentée et était socialement acceptée. Ce conflit entre les gènes et les jugements sociaux est exactement ce qui t'empêche de te réconcilier avec toi-même.</p>`,
e:`<div class="ch">Chapter 2: The Psychological Side</div>
<p>What keeps us alive are emotions: <strong>pleasure, sadness, fear, security…</strong> Even sadness is necessary.</p>
<p>Dopamine is released when you're in a sexual relationship. Your brain makes a connection:</p>
<div class="hl">"Whatever gives me this feeling = a good thing = I'll do it again"</div>
<p>We all know homosexuality has a documented history and was socially accepted. This conflict between genetics and social judgments is exactly what's keeping you from making peace with yourself.</p>`,
s:`<div class="ch">Capítulo 2: El lado psicológico</div>
<p>Lo que nos mantiene vivos son las emociones: <strong>el placer, la tristeza, el miedo, la seguridad…</strong> Incluso la tristeza es necesaria.</p>
<div class="hl">"Lo que me da este sentimiento = algo bueno = lo haré de nuevo"</div>
<p>Todo el mundo sabe que la homosexualidad tiene una historia documentada y era socialmente aceptada. Este conflicto entre los genes y los juicios sociales es lo que te impide hacer las paces contigo mismo.</p>`,
zh:`<div class="ch">第二章：心理层面</div>
<p>让我们保持活力的是情感：<strong>快乐、悲伤、恐惧、安全…</strong>即使是悲伤也是必要的。</p>
<div class="hl">"给我这种感觉的东西 = 好东西 = 我会再做一次"</div>
<p>我们都知道同性恋有有据可查的历史，曾经被社会接受。基因与社会判断之间的冲突正是阻止你与自己和解的原因。</p>`
}},

d:`<div class="ch">الفصل الثالث: أنواع المثلية والشخصية</div>
<ul class="bl">

<li><strong>Les deux (متعدد):</strong> كيبغي موجب وسالب، غالباً مرجّل</li>
<li><strong>موجب 💯</strong></li>

<li><strong>مكبوت:</strong> ظروفو الاجتماعية والمادية خلاتو يكون Actif فدماغو بس</li>

<p>المبنّت علناً: أدّاتو ظروف الحياة للحساسية الزايدة. مع الوقت، كيلقى راحو فدور "المرة".</p>
<p>سالب ولكن مرجّل: إما ما عندوش الجرأة، أو المكانة الاجتماعية ما كتسمحلوش. كيولي مرا مع راسو وراجل فالمجتمع.</p>`,
a:`<div class="ch">الفصل الثالث: أنواع المثلية والشخصية</div>

<li><strong>المكبوت:</strong> ظروفه الاجتماعية والمادية لا تسمح له</li>
</ul>
<p>المبنّت قدام الناس: ظروف الحياة سحبته لحساسية مفرطة. مع الوقت، ينتهي به الحال في دور "الحريم".</p>`,
f:`<div class="ch">Chapitre 3 : Les types d'homosexualité</div>

<li><strong>Actif 💯</strong></li>
<li><strong>Bi (bisexuel) :</strong> sous différentes formes</li>
<li><strong>Refoulé :</strong> ses circonstances ne lui permettent pas</li>
</ul>`,
e:`<div class="ch">Chapter 3: Types of Homosexuality</div>

s:`<div class="ch">Capítulo 3: Los tipos de homosexualidad</div>

zh:`<div class="ch">第三章：同性恋的类型</div>
<ul class="bl">

</ul>`

d:`<div class="ch">الفصل الرابع: نربطو النقط ونعريو الحقيقة</div>
<p>إلى ربطنا هاد الجوج (الجينات + الأحكام الاجتماعية) غانلقاو: كون ما كانش هادشي اللي دارو المجتمع والأديان، كون عايشين الطبيعة ديالنا، مرتاحين وعايشين الحياة En rose 🌹</p>
<p>فاش كاتنعس مع البنت فالفراش، كاينوض داك الضغط ديال المجتمع والدين. الدماغ كايرسل إشارات ديال القضيب والدوبامين لكن ما كايوظفهومش. وهنا كاتلقى ما لقيتيش لا متعة، ولا قضيب ديالك بغى يبقى منتصب.</p>
<p>إلى فهمتي أنك راه طبيعي تمارس مع دري وبنت، غادي تكون مرتاح، والدوبامين خدامين مزيان. هكا غاتصالح مع راسك.</p>`,
a:`<div class="ch">الفصل الرابع: ربط النقاط وكشف الحقيقة</div>
<p>لو ربطنا الجينات مع الأحكام الاجتماعية، نلقى: لولا اللي سواه المجتمع والأديان، كان كلنا عايشين على طبيعتنا، مرتاحين، حياة وردية 🌹</p>
<p>لما تنام مع بنت في الفراش، يشتغل ضغط المجتمع والدين. مخك يرسل إشارات للعضو الذكري والدوبامين لكن يوظفهم غلط. هنا تلقى نفسك ما تحس بأي متعة.</p>
<p>لو فهمت إن من الطبيعي إنك تكون مع عيال وبنات، راح تكون مرتاح تماماً.</p>`,
f:`<div class="ch">Chapitre 4 : Relier les points et révéler la vérité</div>
<p>Si on relie les gènes et les jugements sociaux, on trouve : s'il n'y avait pas eu ce que la société et les religions ont fait, on vivrait tous selon notre nature, la vie en rose 🌹</p>
<p>Quand tu couches avec une fille, la pression sociale s'active. Ton cerveau envoie des signaux au pénis et à la dopamine mais les place mal. C'est là que tu ne trouves aucun plaisir.</p>`,
e:`<div class="ch">Chapter 4: Connecting the Dots and Revealing the Truth</div>
<p>If we connect genetics and social judgments, we find: if it weren't for what society and religions did, we'd all be living our true nature, life like a bed of roses 🌹</p>
<p>When you sleep with a girl in bed, society's pressure kicks in. Your brain sends signals to your penis and dopamine but misplaces them. That's when you find no pleasure.</p>`,
s:`<div class="ch">Capítulo 4: Conectar los puntos y revelar la verdad</div>
<p>Si conectamos los genes y los juicios sociales, encontramos: si no fuera por lo que la sociedad y las religiones hicieron, todos viviríamos según nuestra naturaleza, la vida en color de rosa 🌹</p>`,
zh:`<div class="ch">第四章：连接各点揭示真相</div>
<p>如果我们将基因与社会判断联系起来，我们会发现：如果不是因为社会和宗教所做的一切，我们都会顺应自己的真实本性生活，过着玫瑰般的生活 🌹</p>`
}},
{t:'p',ch:'kh',n:8,c:{
d:`<div class="ch">الخاتمة: حقيقة الشذوذ والتصالح مع الذات</div>
<p>فاش كتشوف هادشي كامل بنظرة وحدة، كتولي تستنتج أن "الشذوذ الجنسي" أصلاً ماشي هو الشذوذ الجنسي!</p>
<div class="hl">الشذوذ الجنسي الحقيقي: هو أنك ما ديرش ديك الحاجة اللي كتحسها من الداخل، أو تبدا تقول حتى انت راه داكشي شذوذ. هاد الفكرة بحد ذاتها: شذوذ فكري.</div>
<p>فالنصيحة ديالي الأولى: عنقو بعضياتكم بلا ذنب، وبلا ما تكونو عبيد للأحكام اللي تقالت قبل ما تولدو.</p>
<p>إيوا أسيادنا، شافكم الأسد! كان معاكم واحد الدماغ لابس كركاس، سميتو RVR. يالاه أخوتي تصبحو على خير 💋</p>`,
a:`<div class="ch">الخاتمة: حقيقة الشذوذ والتصالح مع الذات</div>
<div class="hl">الشذوذ الجنسي الحقيقي: هو أن لا تفعل ما تشعر به من الداخل، أو أن تقول بنفسك إن ذلك شذوذ. هذه الفكرة بحد ذاتها: شذوذ فكري.</div>
<p>يالله يا إخواني، تصبحون على خير. احضنوا بعض بلا ذنب، ولا تكونون عبيد لأحكام قيلت قبل ما توجدون 💋</p>`,
f:`<div class="ch">Conclusion : La vraie déviance</div>
<div class="hl">La vraie déviance sexuelle : c'est de ne pas faire ce que tu ressens de l'intérieur. Cette idée elle-même : c'est une déviance intellectuelle.</div>
<p>Bonne nuit tout le monde. Serrez-vous dans les bras sans culpabilité, et ne soyez pas esclaves des jugements prononcés avant votre naissance 💋</p>`,
e:`<div class="ch">Conclusion: The Real Deviance</div>
<div class="hl">The real sexual deviance: is not doing what you feel inside. That idea itself: is intellectual deviance.</div>
<p>Goodnight everyone. Hug each other without guilt, and don't be slaves to judgments made before you were born 💋</p>`,
s:`<div class="ch">Conclusión: La verdadera desviación</div>
<div class="hl">La verdadera desviación sexual: es no hacer lo que sientes por dentro. Esa idea en sí misma: es una desviación intelectual.</div>
<p>Buenas noches a todos. Abrazaos sin culpa, y no seáis esclavos de los juicios hechos antes de que nacierais 💋</p>`,
zh:`<div class="ch">结语：真正的偏差</div>
<div class="hl">真正的性偏差：是不做你内心感受到的事。这个想法本身：是一种智识上的偏差。</div>
<p>大家晚安。互相拥抱，不要有罪恶感，不要成为出生之前就做出的判断的奴隶 💋</p>`
}},
{t:'p',ch:'c1',n:5,d:'<div class="hl">المسافة بين البروستات والقضيب: من 5 تال 7 سم<br>المسافة بينها وبين فتحة الدبر: 2 سم فقط</div><p>ممكن يكون مع الوقت ما بقاتش غير دور التكاثر، بداو يتأكتيفاو المشاعر والأحاسيس، ولات المتعة بحد ذاتها عايشة فالجسد. حنا كنستنتجو أنا وياك، مجرد استنتاجات.</p>',e:'<div class="hl">Distance between prostate and penis: 5 to 7 cm<br>Distance between it and the anal opening: only 2 cm</div><p>It is very possible that over time, reproduction was not the only purpose anymore. Feelings and sensations started activating, pleasure became embedded in the body itself.</p>',f:'<div class="hl">Distance entre la prostate et le penis : 5 a 7 cm<br>Distance entre elle et lanus : seulement 2 cm</div>',s:'<div class="hl">Distancia entre prostata y pene: 5 a 7 cm<br>Distancia entre ella y el ano: solo 2 cm</div>',a:'<div class="hl">المسافة بين البروستاتا والعضو الذكري: من 5 لين 7 سم<br>المسافة بينها وبين فتحة الدبر: 2 سم بس</div>',zh:'<div class="hl">前列腺与阴茎之间的距离：5至7厘米<br>它与肛门之间的距离：仅2厘米</div>'},
{t:'p',ch:'c2',n:6,d:'<div class="cht">الفصل الثاني: الجانب النفسي وتاريخ الاحكام</div><p>حنا حالياً راه اللي مخليينا على قيد الحياة وجيناتنا قوية، هي الاحاسيس والمشاعر: <strong>متعة، حزن، خوف، امان</strong> الحزن راه حتى هو ضروري. كون ماكانش الحزن، كون الوجود ما عندو معنى.</p><p>والدوبامين هو اللي كيتفرز فاش كتكون فعلاقة جنسية. دماغك هنا كيدير:</p><div class="hl">اللي كيجيب ليا هاد الشعور = حاجة زوينة = نعاودها</div>',e:'<div class="cht">Chapter 2: The Psychological Side</div><p>What keeps us alive and makes our genes strong are emotions and feelings: <strong>pleasure, sadness, fear, security</strong> Even sadness is necessary.</p><div class="hl">Whatever gives me this feeling = a good thing = I will do it again</div>',f:'<div class="cht">Chapitre 2 : Le cote psychologique</div><p>Ce qui nous maintient en vie, ce sont les emotions.</p><div class="hl">Ce qui me donne cette sensation = quelque chose de bien = je vais le refaire</div>',s:'<div class="cht">Capitulo 2: El lado psicologico</div><p>Lo que nos mantiene vivos son las emociones.</p><div class="hl">Lo que me da este sentimiento = algo bueno = lo hare de nuevo</div>',a:'<div class="cht">الفصل الثاني: الجانب النفسي</div><p>اللي يخلينا على قيد الحياة ويخلي جيناتنا قوية، هي المشاعر والاحاسيس.</p><div class="hl">اللي يعطيني هالاحساس = شيء زين = راح اعيده</div>',zh:'<div class="cht">第二章心理层面</div><p>让我们保持活力的是情感。</p><div class="hl">给我这种感觉的东西 = 好东西 = 我会再做一次</div>'},
{t:'p',ch:'c2',n:7,d:'<p>حنا كلنا عارفين بان المثلية عندها تاريخ موثق ومقبولة اجتماعياً. شنو دارو؟ ولات المثلية ممنوعة اجتماعياً. وكاين تفسيرين: اللي مؤمن بخالق ابراهيمي سيقول حرام. واللي مقطع الوراق سيقول: ربما ناس كانت تريد التكاثر السريع وقررت تحريمها اجتماعياً ودينياً؟</p><p>اذن كاين اختلاف بين الجينات والاحكام الاجتماعية. واللي بغينا نوصلو ليه: هاد الاختلاف هو اللي مخليك ما تتصالحش مع راسك.</p>',e:'<p>We all know that homosexuality has a documented history and was socially accepted. What happened? Homosexuality became socially forbidden.</p><p>There are two interpretations: whoever believes in an Abrahamic God will say it is haram. And the freethinker will say: maybe some people wanted fast reproduction and decided to ban it?</p><p>So there is a conflict between genetics and social judgments. And this conflict is exactly what is keeping you from making peace with yourself.</p>',f:'<p>Tout le monde sait que lhomosexualite a une histoire documentee et etait socialement acceptee. Quest-ce qui sest passe ? Elle est devenue socialement interdite.</p><p>Ce conflit entre les genes et les jugements sociaux est exactement ce qui temmpeche de te reconcilier avec toi-meme.</p>',s:'<p>Todo el mundo sabe que la homosexualidad tiene una historia documentada y era socialmente aceptada. Que paso? Se volvio socialmente prohibida.</p><p>Este conflicto entre los genes y los juicios sociales es exactamente lo que te impide hacer las paces contigo mismo.</p>',a:'<p>كلنا عارفين ان المثلية عندها تاريخ موثق وكانت مقبولة اجتماعياً. وش صار؟ صارت المثلية ممنوعة.</p><p>هالتعارض بين الجينات والاحكام هو بالضبط اللي يمنعك من تقبل نفسك.</p>',zh:'<p>我们都知道同性恋有有据可查的历史曾经被社会接受。发生了什么？同性恋变成了社会禁忌。</p><p>基因和社会判断之间的冲突正是阻止你与自己和解的原因。</p>'},
{t:'p',ch:'c3',n:9,d:'<p><strong>1) المبنت علناً:</strong> هاد النوع ادّاتو ظروف الحياة للحساسية الزايدة وضعف الشخصية. تخيل بنادم يعيش فمجتمع كيقول: المثلي = ناقص رجولة، حرام. مع الوقت، كيلقى راحو فدور المرة، كيقلد صورة الانثى.</p><p><strong>2) سالب ولكن مرجّل:</strong> اما ما عندوش الجراة، او المكانة الاجتماعية والعائلية ما كتسمحلوش. فالاخير كيولي مرا مع راسو وراجل فالمجتمع، عايش جوج شخصيات.</p><p><strong>3) Les deux (Versatile):</strong> الظروف ديالو خلاتو يستنتج انه يقدر يجمع الاتجاهين. الدور اللي كيلعبو فالعلاقة كيولي مسالة ديال الشعور فداك اللحظة، ماشي هوية ثابتة.</p>',e:'<p><strong>1) The Openly Effeminate:</strong> Life circumstances dragged this type into extreme sensitivity. Imagine someone growing up in a society where homosexuality is a massive red line. Internal repression follows. Over time, he ends up in the woman role.</p><p><strong>2) Passive but Masculine:</strong> Either lacks the audacity or his social status does not allow it. He becomes a woman with himself, and a man in society. Living two personalities.</p><p><strong>3) Both (Versatile):</strong> His circumstances led him to conclude he can combine both directions. The role he plays becomes a matter of feeling in that moment, not a fixed identity.</p>',f:'<p><strong>1) Leffenine au grand jour :</strong> Les circonstances de la vie lont mene vers une sensibilite extreme. Il finit par jouer le role de la femme.</p><p><strong>2) Passif mais viril :</strong> Il vit deux personnalites.</p><p><strong>3) Les deux (Versatile) :</strong> Le role quil joue devient une question de ressenti du moment.</p>',s:'<p><strong>1) El abiertamente afeminado:</strong> Las circunstancias lo llevaron a sensibilidad extrema. Con el tiempo acaba en el rol de la mujer.</p><p><strong>2) Pasivo pero masculino:</strong> Vive dos personalidades.</p><p><strong>3) Los dos (Versatile):</strong> El rol se convierte en una cuestion de como se siente en ese momento.</p>',a:'<p><strong>1) المبنت قدام الناس:</strong> ظروف الحياة سحبته لحساسية مفرطة. مع الوقت، ينتهي به الحال في دور الحريم.</p><p><strong>2) السالب بس مسوي فيها رجال:</strong> يعيش شخصيتين.</p><p><strong>3) الاثنين (Versatile):</strong> الدور اللي يلعبه يصير مسالة احساس في تلك اللحظة.</p>',zh:'<p><strong>1) 公开女性化的男生：</strong>最终扮起女人的角色。</p><p><strong>2) 受但很爷们：</strong>活在两种人格中。</p><p><strong>3) 两者皆可百变：</strong>他在关系中扮演的角色变成了那个时刻的感受问题。</p>'},
{t:'p',ch:'c3',n:10,d:'<p><strong>4) الموجب (Actif):</strong> هاد خونا غالباً كيكون عندو واحد التوازن بين شخصيتو وجيناتو. من شخصيتو كيبغي يكون هو الموجب وهو المسيطر فالعلاقة.</p><p><strong>5) Bi (مزدوج الميول):</strong> غالباً هاد السيد من صغرو عاش مع البنات، وغالباً ما كتكون تجربتو الاولى مع بنت. كاين Bi Actif وكاين Bi Les deux وكاين Bi Passif.</p><p><strong>6) المكبوت:</strong> راه حتى هو كيمارس الجينات ديالو، غير ظروفو الاجتماعية والمادية خلاتو يكون Actif فدماغو. احتمال كبير كون كان عندو فلوس يقدر يوصل يكون Bi.</p><p>وكاين حتى النوع اللي كيسمى Hetero: كتلقى هاد النوع ظروفو المادية معاوناه، هو فمرحلة مكتفي بالبنت.</p>',e:'<p><strong>4) Active:</strong> He usually has a balance between his personality and genetics. His personality makes him want to be the dominant one in the relationship.</p><p><strong>5) Bisexual (Bi):</strong> Generally this guy grew up surrounded by women, his first experience was with a girl. Roles: Bi Active, Bi Both, Bi Passive.</p><p><strong>6) The Suppressed:</strong> He also practices his genetics, but his social and financial circumstances kept him active only in his head. High probability that if he had freedom, he would end up as Bi.</p>',f:'<p><strong>4) Actif :</strong> Il a generalement un equilibre entre sa personnalite et ses genes.</p><p><strong>5) Bisexuel :</strong> A generalement grandi entoure de femmes, premiere experience avec une fille.</p><p><strong>6) Le refoule :</strong> Ses circonstances sociales et financieres lont maintenu actif seulement dans sa tete.</p>',s:'<p><strong>4) Activo:</strong> Tiene un equilibrio entre su personalidad y sus genes.</p><p><strong>5) Bisexual:</strong> Generalmente crecio rodeado de mujeres, primera experiencia con una chica.</p><p><strong>6) El reprimido:</strong> Sus circunstancias lo mantuvieron activo solo en su cabeza.</p>',a:'<p><strong>4) الموجب:</strong> لديه توازن بين شخصيته وجيناته.</p><p><strong>5) المزدوج (Bi):</strong> غالباً نشا وسط الاناث، اول تجربة مع بنت.</p><p><strong>6) المكبوت:</strong> ظروفه الاجتماعية والمادية خلته نشطاً فقط في مخه.</p>',zh:'<p><strong>4) 攻主动型：</strong>想成为关系中的主导者。</p><p><strong>5) 双性恋Bi：</strong>通常从小就与女生一起长大。</p><p><strong>6) 压抑型：</strong>他的社会和经济环境使他只能在头脑中活跃。</p>'},
{t:'p',ch:'c4',n:12,d:'<p>كيف گلنا، كاتكبر بافكار من الصغر: المثلية خط احمر كبير فالمجتمع، وانت كتحس بطبيعتك. فاش كتشوف المجتمع والدين يرفض داكشي نهائياً، دماغك كيقول: انا ماشي ديال الدراري.</p><p>فاش كاتنعس مع البنت فالفراش، كاينوض داك الضغط ديال المجتمع والدين. الدماغ كايرسل اشارات ديال القضيب والدوبامين لكن ما كايوظفهومش. وهنا كاتلقى ما لقيتيش لا متعة، ولا قضيب ديالك بغى يبقى منتصب.</p><p>الى انت فهمتي هادشي كامل، غادي تكون مرتاح، والدوبامين خدامين مزيان. هكا غاتصالح مع راسك.</p><div class="hl">وملي حلّينا هاد القوس، هاد الرسالة ليك اختي: الى كان راجلك كيبغي يمارس مع دري، خاصك تكوني كتحترمي الطبيعة ديالو.</div>',e:'<p>As we said, you grow up from childhood with the idea: homosexuality is a massive red line in society, while at the same time, you feel your true nature.</p><p>When you sleep with a girl in bed, society pressure kicks in. Your brain sends signals to your penis and the dopamine that should be present, but it misplaces them. That is when you find no pleasure.</p><p>If you understand that it is natural for you to be with both a guy and a girl, you will be totally at ease, and the dopamine will work perfectly. That is how you make peace with yourself.</p><div class="hl">And this message is for you, sister: if your man wants to be with a guy, you need to respect his nature.</div>',f:'<p>Comme on a dit, tu grandis avec lidee que lhomosexualite est une ligne rouge enormement, alors quen meme temps, tu ressens ta vraie nature.</p><p>Quand tu couches avec une fille au lit, la pression sociale sactive. Ton cerveau envoie des signaux a ton penis et a la dopamine, mais les place mal.</p><div class="hl">Et ce message est pour toi, ma soeur : si ton homme veut etre avec un gars, tu dois respecter sa nature.</div>',s:'<p>Cuando ves que la sociedad y la religion rechazan esto completamente, tu cerebro se dice que no eres de los chicos.</p><p>Cuando te acuestas con una chica, la presion social se activa. Tu cerebro envia senales a tu pene y la dopamina, pero las coloca mal.</p><div class="hl">Y este mensaje es para ti, hermana: si tu hombre quiere estar con un chico, debes respetar su naturaleza.</div>',a:'<p>لما تشوف ان المجتمع والدين يرفضون هالشيء نهائياً، مخك يقول لنفسه: انا ماني راعي عيال.</p><p>لما تنام مع بنت في الفراش، يشتغل ضغط المجتمع. مخك يرسل اشارات للعضو الذكري والدوبامين لكن يوظفهم غلط.</p><div class="hl">ورسالتي لك يا اختي: لو راجلك يبي يكون مع عيال، لازم تحترمي طبيعته.</div>',zh:'<p>当你看到社会和宗教完全拒绝这一点时，你的大脑对自己说我不适合男生。</p><p>当你在床上和一个女生睡觉时，社会压力被激活。你的大脑把多巴胺放错了地方。</p><div class="hl">这个信息是给你的姐妹：如果你的男人想和一个男生在一起，你需要尊重他的本性。</div>'},
{t:'p',ch:'kh',n:14,d:'<p>ايوا اسيادنا، شافكم الاسد! كان معاكم واحد الدماغ لابس كركاس، سميتو RVR.</p><p>انا غير دماغ كينقل الافكار عن طريق هاد الوجه اللي كايكتب ليكم. انا و Abdo Moka ولّينا عشران تال الموووت.</p><p>الى ساليت هاد الكتاب، كاين كتاب قبلو ابحثو عليه فالانترنت غاتلقاوه ان شاء الله.</p><div class="hl">يالاه اخوتي تصبحو على خير. عنقو بعضياتكم بلا ذنب، وبلا ما تكونو عبيد للاحكام اللي تقالت قبل ما تولدو. تهلاو فراسكم والورد يرجع لبلاصتو! 💋</div><p style="text-align:center;margin-top:14px;color:#aaa;font-size:0.82rem;">RVR & Abdo Moka – 2025</p>',e:'<p>Farewell friends! You have been with a brain wearing a shell, named RVR. Me and Abdo Moka we have been inseparable forever.</p><div class="hl">Goodnight everyone. Hug each other without guilt, and do not be slaves to judgments made before you were born. Take care of yourselves, and let the roses return to where they belong! 💋</div><p style="text-align:center;margin-top:14px;color:#aaa;font-size:0.82rem;">RVR & Abdo Moka – 2025</p>',f:'<p>Au revoir mes amis ! Un cerveau nomme RVR etait avec vous, moi et Abdo Moka, inseparables pour toujours.</p><div class="hl">Bonne nuit tout le monde. Serrez-vous dans les bras sans culpabilite ! 💋</div>',s:'<p>Adios amigos! Un cerebro llamado RVR estaba con vosotros, yo y Abdo Moka, inseparables para siempre.</p><div class="hl">Buenas noches a todos. Abrazaos sin culpa ! 💋</div>',a:'<p>يالله يا جماعة، الاسد شافكم! كان معكم مخ جالس في هيكل، اسمه RVR. انا وAbdo Moka رفاق للابد.</p><div class="hl">يالله يا اخواني، تصبحون على خير. احضنوا بعض بلا ذنب ! 💋</div>',zh:'<p>好了，大家，狮子看到你们了！RVR一个装在躯壳里的大脑一直与你们在一起。我和Abdo Moka永远形影不离。</p><div class="hl">大家晚安。互相拥抱，不要有罪恶感！💋</div>'},

// ===== RENDER =====
function isRTL(){ return lang==='d'||lang==='a'; }

function renderPage(idx){
  const p=pages[idx];
  const area=document.getElementById('pagesArea');
  area.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  let el=area.querySelector(`[data-page="${idx}"]`);
  if(!el){el=document.createElement('div');el.dataset.page=idx;area.appendChild(el);}

  if(p.t==='cover'){
    el.className='page cover on';
    const tv=T.cover[lang]||T.cover['e'];
    el.innerHTML=`<div class="cv-c tl"></div><div class="cv-c tr"></div><div class="cv-c bl"></div><div class="cv-c br"></div>
    <div class="cv-wrap">
      <div class="cv-tag">${tv[3]}</div>
      <div class="cv-title">${tv[0]} <span>${tv[1]}</span></div>
      <div class="cv-sub">${tv[2]}</div>
      <div class="cv-line"></div>
      <div class="cv-author">بقلم <span>RVR & Abdo Moka</span></div>
      <div class="cv-yr">النسخة الكاملة • 2025</div>
    </div>`;
  } else if(p.t==='bcover'){
    el.className='page bcover on';
    const q={d:'الطبيعة… أ ربيعة،\nماشي دايماً كما كيصوروها ليك،\nولكن دائماً فيها منطق.',
      a:'الطبيعة… يا ربيعة،\nليست دائماً كما يصوّرونها لك.',
      f:'La nature… ô Rabia,\nn\'est pas toujours comme on te la décrit.',
      e:'Nature… O Rabia,\nnot always as they paint it for you.',
      s:'Naturaleza… Oh Rabia,\nno siempre como te la pintan.',
      zh:'自然… 哦 Rabia，\n并不总是他们描述的那样。'};
    el.innerHTML=`<div class="bc-wrap">
      <div style="color:rgba(64,145,108,0.3);font-size:2rem;margin-bottom:14px;">❝</div>
      <div class="bc-q">${(q[lang]||q['e']).replace(/\n/g,'<br>')}</div>
      <div style="color:rgba(245,230,200,0.3);font-size:0.82rem;">RVR & Abdo Moka</div>
    </div>`;
  } else if(p.t==='paywall'){
    el.className='page on';
    el.style.cssText='position:absolute;inset:0;background:var(--page);border-radius:0 8px 8px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;';
    const pw=T.pw[lang]||T.pw['d'];
    document.getElementById('pwTitle').textContent=pw.title;
    document.getElementById('pwSub').innerHTML=pw.sub;
    document.getElementById('pwModal').classList.add('show');
    el.innerHTML=`<div style="font-size:3rem;">🔒</div>`;
  } else {
    el.className='page on';
    el.style.cssText='';
    el.innerHTML=`<div class="ph"><span class="ch-lbl">${T.ch[p.ch][lang]||''}</span><span class="pg-num">${p.n}</span></div>
    <div class="pb"><div class="pt">${p.c[lang]||p.c['e']||''}</div></div>`;
  }

  const onPw = p.t==='paywall';
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  prevBtn.disabled=idx===0;
  nextBtn.disabled=idx===pages.length-1||onPw;
  if(onPw){prevBtn.classList.add('active-back');}
  else{prevBtn.classList.remove('active-back');}
  document.getElementById('pi').textContent=`${idx+1} / ${pages.length}`;
}

function changePage(d){
  const next=pg+d;
  if(next<0||next>=pages.length)return;
  if(!unlocked&&next>FREE&&pages[next].t!=='paywall'){pg=FREE+1;renderPage(pg);return;}
  pg=next;renderPage(pg);
}

function nav(dir){
  if(pages[pg]&&pages[pg].t==='paywall'&&dir==='prev'){
    document.getElementById('pwModal').classList.remove('show');
    pg=FREE-1;renderPage(pg);return;
  }
  changePage(dir==='next'?1:-1);
}

function goBack(){
  document.getElementById('pwModal').classList.remove('show');
  pg=FREE-1;renderPage(pg);
}

function tryCode(){
  const raw=document.getElementById('codeIn').value;
  const v=raw.trim().toUpperCase().replace(/\s/g,'');
  if(isValidCode(v)){
    unlocked=true;
    localStorage.setItem('rvr_access','1');
    document.getElementById('pwModal').classList.remove('show');
    pg=FREE+2;
    if(pg>=pages.length)pg=FREE+2;
    renderPage(pg);
  } else {
    document.getElementById('pwErr').textContent='❌ الكود غلط – جرب مرة أخرى';
    document.getElementById('codeIn').style.borderColor='#c0392b';
    setTimeout(()=>{
      document.getElementById('pwErr').textContent='';
      document.getElementById('codeIn').style.borderColor='';
    },3000);
  }
}

document.getElementById('codeIn').addEventListener('keydown',e=>{
  if(e.key==='Enter')tryCode();
});

function setL(l,btn){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.documentElement.dir=isRTL()?'rtl':'ltr';
  document.getElementById('prevBtn').innerHTML=isRTL()?'&#8594;':'&#8592;';
  document.getElementById('nextBtn').innerHTML=isRTL()?'&#8592;':'&#8594;';
  if(pages[pg]&&pages[pg].t==='paywall'){
    const pw=T.pw[lang]||T.pw['d'];
    document.getElementById('pwTitle').textContent=pw.title;
    document.getElementById('pwSub').innerHTML=pw.sub;
  }
  renderPage(pg);
}

(function(){
  if(localStorage.getItem('rvr_access')==='1'){unlocked=true;}
  renderPage(0);

  // SWIPE
  let sx=0;
  document.getElementById('bookStage')||document.querySelector('.book-stage');
  const bs=document.querySelector('.book-stage');
  bs.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;});
  bs.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40){
      if(isRTL())changePage(dx<0?1:-1);
      else changePage(dx>0?-1:1);
    }
  });
})();
</script>
</body>
</html>
